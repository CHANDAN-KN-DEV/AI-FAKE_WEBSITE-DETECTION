version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: clarifact-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clarifact
    ports:
      - "5432:5432"
    volumes:
      - clarifact_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: clarifact-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - clarifact_redis:/data

volumes:
  clarifact_pgdata:
  clarifact_redis:
